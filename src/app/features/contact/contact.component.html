<section id="contact" class="py-32 bg-surface section-reveal relative">
  <!-- Radial gradient glow behind headline (bookends with Hero) -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[radial-gradient(circle,_rgba(99,102,241,0.06)_0%,_rgba(99,102,241,0.03)_25%,_transparent_50%)] blur-[60px]"></div>
  </div>

  <div class="max-w-2xl mx-auto px-6 text-center relative z-10">
    <!-- Headline -->
    <h2 class="text-4xl md:text-5xl font-bold text-text-primary mb-6">
      {{ contactData.headline }}
    </h2>

    <!-- Subtext -->
    <p class="text-lg text-text-secondary mb-12 max-w-xl mx-auto">
      {{ contactData.subtext }}
    </p>

    <!-- Email Button -->
    <button
      (click)="sendEmail()"
      class="inline-flex items-center gap-3 px-10 py-4 mb-12 text-lg font-semibold rounded-lg bg-accent text-surface hover:bg-accent-hover hover:shadow-glow transition-all duration-400 hover:scale-105"
      style="transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, box-shadow 0.3s ease;">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
      </svg>
      {{ contactData.email }}
    </button>

    <!-- Social Links -->
    <div class="flex justify-center items-center gap-6 mb-12">
      <a
        *ngFor="let social of contactData.socialLinks"
        [href]="social.url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="social.ariaLabel"
        class="p-3 rounded-lg text-text-muted hover:text-accent hover:bg-surface-raised transition-all duration-300 hover:scale-110 group"
        style="transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s ease, background-color 0.3s ease;">
        
        <!-- WhatsApp Icon -->
        <svg *ngIf="social.platform === 'WhatsApp'" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>

        <!-- GitHub Icon -->
        <svg *ngIf="social.platform === 'GitHub'" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
        </svg>

        <!-- LinkedIn Icon -->
        <svg *ngIf="social.platform === 'LinkedIn'" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>
        </svg>

        <!-- Twitter/X Icon -->
        <svg *ngIf="social.platform === 'Twitter'" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
        </svg>
      </a>
    </div>

    <!-- Download CV Card Section -->
    <div class="pt-8 border-t border-border/40 max-w-md mx-auto">
      <div class="p-6 rounded-2xl bg-surface-raised/40 border border-border/60 backdrop-blur-md space-y-4 shadow-xl">
        <div class="flex items-center justify-center gap-3">
          <svg class="w-6 h-6 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <h3 class="text-lg font-bold text-text-primary">Curriculum Vitae</h3>
        </div>
        <p class="text-xs font-mono text-text-muted">
          Download my official resume to review my full software engineering experience & credentials.
        </p>
        <a
          href="/assets/Abdulrahman Tamassili Khanji - Resume.pdf"
          target="_blank"
          download="Abdulrahman_Tamassili_Khanji_Resume.pdf"
          class="inline-flex items-center justify-center gap-2.5 w-full py-3 px-6 rounded-xl bg-accent/15 border border-accent/30 hover:bg-accent hover:text-surface text-sm font-mono text-accent font-bold transition-all duration-300 shadow-sm cursor-pointer hover:scale-[1.02]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          <span>Download CV (PDF)</span>
        </a>
      </div>
    </div>

  </div>
</section>
